# When you push a version tag (for example v0.4.3), this builds the one-click files and attaches them to a GitHub
# Release. Release files download directly in the browser (files in the repository only open as text).
name: Release download files
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build:downloads
      - name: Create the release with the files attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" downloads/* --title "$GITHUB_REF_NAME" --generate-notes
