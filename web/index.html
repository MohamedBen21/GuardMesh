<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FocusGuard Network</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b2430; --muted:#667085; --line:#e4e7ec; --accent:#2f6f5e; --danger:#b42318; --warn:#b54708; }
  @media (prefers-color-scheme: dark) { :root { --bg:#10151b; --card:#171e26; --ink:#e8edf2; --muted:#98a2b3; --line:#2a333d; --accent:#4fb39a; --danger:#f97066; --warn:#fdb022; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Tahoma,sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .top select { width:auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; } h2 { font-size: 1.1rem; margin: 0 0 8px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; margin:10px 0 4px; font-weight:600; font-size:.9rem; }
  label.opt { font-weight:400; font-size:1rem; }
  input[type=text], input[type=password], input[type=number], select { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button.secondary { background:transparent; color:var(--ink); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; align-items:center; justify-content:space-between; padding:8px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
  .row:first-of-type { border-top:0; }
  .muted { color:var(--muted); font-size:.9rem; }
  .pill { display:inline-block; padding:2px 10px; border-radius:99px; font-size:.8rem; font-weight:600; }
  .ok { background:color-mix(in srgb,var(--accent) 18%,transparent); color:var(--accent); }
  .off { background:color-mix(in srgb,var(--danger) 18%,transparent); color:var(--danger); }
  .key { font:700 1.3rem ui-monospace,Menlo,monospace; letter-spacing:.05em; padding:12px; background:var(--bg); border:1px dashed var(--line); border-radius:8px; text-align:center; direction:ltr; }
  .warn { color:var(--warn); }
  .actions { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  ol { padding-inline-start: 22px; } li { margin: 6px 0; }
  code { direction:ltr; unicode-bidi:embed; }
  details summary { cursor:pointer; }
  .box { border:1px solid var(--line); border-radius:10px; padding:12px; margin:12px 0; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1>FocusGuard Network</h1><p class="sub" id="sub">…</p></div>
    <select id="lang" aria-label="Language"></select>
  </div>
  <div id="app"></div>
</main>

<script src="translations.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const LANG_NAMES = { en: 'English', fr: 'Français', ar: 'العربية' };

let lang = 'en';
try { lang = localStorage.getItem('fg-lang') || (navigator.language || 'en').slice(0, 2); } catch (e) {}
if (!T[lang]) lang = 'en';

const t = (k, v = {}) => String(T[lang][k] ?? T.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => (v[x] ?? ''));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fail = (e) => alert(e.message);

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  try { localStorage.setItem('fg-lang', lang); } catch (e) {}
}
const langSel = $('#lang');
langSel.innerHTML = Object.entries(LANG_NAMES).map(([k, n]) => `<option value="${k}">${n}</option>`).join('');
langSel.value = lang;
langSel.onchange = () => { lang = langSel.value; wiz.lang = lang; applyLang(); if (status) render(); };

const fmtDelay = (m) => (m % 1440 === 0 ? t('u_day', { n: m / 1440 }) : m % 60 === 0 ? t('u_hour', { n: m / 60 }) : t('u_min', { n: m }));
const fmtLeft = (ts) => { const ms = ts - Date.now(); if (ms <= 0) return '0m'; const m = Math.ceil(ms / 60000); return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`; };

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

let status = null;
let step = 1;
let settingsOpen = false;
const wiz = { mode: 'self', delayMinutes: 1440, lang, partnerKey: null, delivered: false };

async function load() {
  status = await api('/api/status');
  render();
}

function render() {
  applyLang();
  $('#sub').textContent = status.setupDone ? t('sub_dash') : t('sub_setup', { n: step });
  status.setupDone ? renderDash() : renderWizard();
}

/* ---------- Wizard ---------- */
function renderWizard() {
  if (step === 1) {
    const opts = [60, 360, 1440, 4320].map((v) => `<option value="${v}" ${wiz.delayMinutes === v ? 'selected' : ''}>${t('w1_d' + v)}</option>`).join('');
    app.innerHTML = `<div class="card">
      <h2>${t('w1_title')}</h2>
      <label class="opt"><input type="radio" name="mode" value="self" ${wiz.mode === 'self' ? 'checked' : ''}> ${t('w1_self')}</label>
      <label class="opt"><input type="radio" name="mode" value="parental" ${wiz.mode === 'parental' ? 'checked' : ''}> ${t('w1_family')}</label>
      <label for="delay">${t('w1_delay')}</label>
      <select id="delay">${opts}</select>
      <p class="muted">${t('w1_note')}</p>
      <div class="actions"><button id="next">${t('cont')}</button></div></div>`;
    $('#next').onclick = () => { wiz.mode = $('input[name=mode]:checked').value; wiz.delayMinutes = Number($('#delay').value); step = 2; render(); };
  } else if (step === 2) {
    app.innerHTML = `<div class="card">
      <h2>${t('w2_title')}</h2>
      <p class="muted">${t('w2_text')}</p>
      <label>${t('w2_chat')}</label><input type="text" id="tgChat" placeholder="123456789" inputmode="numeric" dir="ltr">
      <label>${t('w2_token')}</label><input type="text" id="tgToken" placeholder="123456:ABC…" dir="ltr" autocomplete="off">
      <label>${t('w2_hook')}</label><input type="text" id="hook" placeholder="https://…" dir="ltr">
      <details class="box"><summary>${t('w2_help_t')}</summary>${t('w2_help')}</details>
      <p class="muted">${t('w2_empty')}</p>
      <div class="actions"><button class="secondary" id="back">${t('back')}</button><button id="next">${t('w2_create')}</button></div></div>`;
    $('#back').onclick = () => { step = 1; render(); };
    $('#next').onclick = async (e) => {
      e.target.disabled = true; e.target.textContent = t('w2_working');
      try {
        const r = await api('/api/setup', { mode: wiz.mode, delayMinutes: wiz.delayMinutes, lang, partner: { telegramChatId: $('#tgChat').value.trim(), telegramBotToken: $('#tgToken').value.trim(), webhookUrl: $('#hook').value.trim() } });
        wiz.partnerKey = r.partnerKey || null; wiz.delivered = r.keyDeliveredToPartner; step = 3; render();
      } catch (err) { fail(err); e.target.disabled = false; e.target.textContent = t('w2_create'); }
    };
  } else if (step === 3) {
    app.innerHTML = `<div class="card">
      <h2>${t('w3_title')}</h2>
      ${wiz.delivered ? `<p>${t('w3_sent')}</p>` :
        `<p class="warn"><b>${t('w3_warn')}</b></p><div class="key">${esc(wiz.partnerKey)}</div><p class="muted">${t('w3_look')}</p>`}
      <div class="actions"><button id="next">${wiz.delivered ? t('cont') : t('w3_saved')}</button></div></div>`;
    $('#next').onclick = () => { wiz.partnerKey = null; step = 4; render(); };
  } else if (step === 4) {
    app.innerHTML = `<div class="card">
      <h2>${t('w4_title')}</h2>
      <p class="muted">${t('w4_intro')}</p>
      <div class="box"><b>${t('w4_full_t')}</b>${t('w4_full')}
        <p class="muted">${t('w4_tip')}</p>
        <div class="actions"><button id="dhcp">${t('w4_full_btn')}</button></div></div>
      <div class="box"><b>${t('w4_dns_t')}</b><p>${t('w4_dns', { host: esc(location.hostname) })}</p>
        <div class="actions"><button class="secondary" id="dnsonly">${t('w4_dns_btn')}</button></div></div>
      <div class="actions"><button class="secondary" id="back">${t('back')}</button></div></div>`;
    $('#back').onclick = () => { step = 3; render(); };
    $('#dnsonly').onclick = () => { step = 5; render(); };
    $('#dhcp').onclick = async (e) => { e.target.disabled = true; try { await api('/api/setup/dhcp', {}); step = 5; render(); } catch (err) { fail(err); e.target.disabled = false; } };
  } else if (step === 5) {
    app.innerHTML = `<div class="card"><h2>${t('w5_title')}</h2>
      <p class="muted">${t('w5_text')}</p>
      <div id="devs"><p class="muted">${t('w5_looking')}</p></div>
      <div class="actions"><button class="secondary" id="refresh">${t('w5_refresh')}</button><button id="finish">${t('w5_finish')}</button></div></div>`;
    const refresh = async () => {
      try {
        const devs = await api('/api/devices');
        $('#devs').innerHTML = devs.length ? devs.map((d) => `<div class="row"><label class="opt" style="margin:0"><input type="checkbox" value="${esc(d.mac)}"> ${esc(d.name)} <span class="muted" dir="ltr">${esc(d.mac)}</span></label></div>`).join('') : `<p class="muted">${t('w5_none')}</p>`;
      } catch (err) { $('#devs').innerHTML = `<p class="warn">${esc(err.message)}</p>`; }
    };
    $('#refresh').onclick = refresh; refresh();
    $('#finish').onclick = async () => { try { await api('/api/setup/finish', { trusted: [...document.querySelectorAll('#devs input:checked')].map((i) => i.value) }); await load(); } catch (err) { fail(err); } };
  }
}

/* ---------- Dashboard ---------- */
const devName = (mac) => (status.devices.find((d) => d.mac === mac) || {}).name || mac;

function renderDash() {
  const on = status.protection !== false;
  const langOpts = Object.entries(LANG_NAMES).map(([k, n]) => `<option value="${k}" ${status.lang === k ? 'selected' : ''}>${n}</option>`).join('');
  app.innerHTML = `
  <div class="card">
    <div class="row"><div><h2 style="margin:0">${t('d_protection')}</h2><span class="muted">${t('d_wait', { d: fmtDelay(status.delayMinutes) })}</span></div>
    <span class="pill ${on ? 'ok' : 'off'}">${status.protection === null ? t('d_unknown') : on ? t('d_on') : t('d_off')}</span></div>
    <div class="actions">
      <button id="restore" class="${on ? 'secondary' : ''}">${t('d_restore')}</button>
      <button id="pause" class="secondary">${t('d_pause')}</button>
    </div>
  </div>
  <div class="card"><h2>${t('d_requests')}</h2>
    ${status.changes.length ? status.changes.map((c) => `<div class="row"><div><b>${c.kind === 'disable_all' ? t('d_pause_all') : t('d_stop_filtering', { d: esc(devName(c.mac)) })}</b><br>
      <span class="muted">${c.status === 'pending' ? t('d_starts_in', { t: fmtLeft(c.unlockAt) }) : t('d_active') + ', ' + (c.activeUntil ? t('d_ends_in', { t: fmtLeft(c.activeUntil) }) : t('d_until_restored'))}</span></div>
      <div><button class="secondary" data-cancel="${esc(c.id)}">${t('d_cancel')}</button>
      ${c.status === 'pending' ? `<button class="secondary" data-approve="${esc(c.id)}">${t('d_approve')}</button>` : ''}</div></div>`).join('') : `<p class="muted">${t('d_no_requests')}</p>`}
  </div>
  <div class="card"><h2>${t('d_devices')}</h2>
    ${!status.dhcp ? `<p class="muted">${t('d_dns_only')}</p>` : ''}
    ${status.devices.length ? status.devices.map((d) => `<div class="row"><div>${esc(d.name)}<br><span class="muted" dir="ltr">${esc(d.mac)}</span></div>
      <div><span class="pill ${d.policy === 'strict' ? 'ok' : 'off'}">${d.policy === 'strict' ? t('d_filtered') : t('d_unfiltered')}</span>
      ${d.policy === 'strict' ? `<button class="secondary" data-exempt="${esc(d.mac)}">${t('d_req_exempt')}</button>` : `<button class="secondary" data-strict="${esc(d.mac)}">${t('d_filter_again')}</button>`}</div></div>`).join('') : `<p class="muted">${t('d_no_devices')}</p>`}
  </div>
  <div class="card"><h2>${t('d_connect')}</h2><p class="muted">${t('d_connect_text', { host: `<code>${esc(location.hostname)}</code>` })}</p></div>
  <details class="card" id="settings" ${settingsOpen ? 'open' : ''}>
    <summary><b>${t('s_title')}</b>${status.partner.telegram ? ` <span class="pill ok">${t('s_telegram_on')}</span>` : ''}</summary>
    <label>${t('s_key')}</label><input type="password" id="sKey" autocomplete="off" dir="ltr">
    <label>${t('s_delay')}</label><input type="number" id="sDelay" min="15" value="${status.delayMinutes}" dir="ltr">
    <label>${t('s_lang')}</label><select id="sLang">${langOpts}</select>
    <label>${t('s_chat')}</label><input type="text" id="sChat" value="${esc(status.partner.chatId)}" inputmode="numeric" dir="ltr">
    <label>${t('s_token')}</label><input type="text" id="sToken" placeholder="${status.partner.telegram ? t('s_token_kept') : '123456:ABC…'}" autocomplete="off" dir="ltr">
    <label>${t('s_hook')}</label><input type="text" id="sHook" placeholder="${status.partner.webhook ? '•••' : 'https://…'}" dir="ltr">
    <div class="actions"><button id="sSave">${t('s_save')}</button><button class="secondary" id="sTest">${t('s_test')}</button></div>
  </details>
  <div class="card"><h2>${t('d_activity')}</h2>${status.log.slice().reverse().map((l) => `<div class="muted">${new Date(l.at).toLocaleString()} — ${esc(l.event)}</div>`).join('') || `<p class="muted">${t('d_nothing')}</p>`}</div>`;

  $('#settings').addEventListener('toggle', (e) => { settingsOpen = e.target.open; });
  $('#restore').onclick = async () => { try { await api('/api/restore', {}); load(); } catch (e) { fail(e); } };
  $('#pause').onclick = async () => {
    const mins = prompt(t('p_pause'), '60');
    if (!mins) return;
    try { await api('/api/changes', { kind: 'disable_all', durationMinutes: Number(mins) }); load(); } catch (e) { fail(e); }
  };
  app.querySelectorAll('[data-cancel]').forEach((b) => (b.onclick = async () => { try { await api(`/api/changes/${b.dataset.cancel}/cancel`, {}); load(); } catch (e) { fail(e); } }));
  app.querySelectorAll('[data-approve]').forEach((b) => (b.onclick = async () => {
    const k = prompt(t('p_key')); if (!k) return;
    try { await api(`/api/changes/${b.dataset.approve}/approve`, { partnerKey: k }); load(); } catch (e) { fail(e); }
  }));
  app.querySelectorAll('[data-exempt]').forEach((b) => (b.onclick = async () => {
    const mins = prompt(t('p_exempt'), '120');
    try { await api('/api/changes', { kind: 'exempt_device', mac: b.dataset.exempt, durationMinutes: mins ? Number(mins) : null }); load(); } catch (e) { fail(e); }
  }));
  app.querySelectorAll('[data-strict]').forEach((b) => (b.onclick = async () => { try { await api(`/api/devices/${encodeURIComponent(b.dataset.strict)}/strict`, {}); load(); } catch (e) { fail(e); } }));

  $('#sSave').onclick = async () => {
    const body = { partnerKey: $('#sKey').value, delayMinutes: Number($('#sDelay').value), lang: $('#sLang').value,
      partner: { telegramChatId: $('#sChat').value.trim(), telegramBotToken: $('#sToken').value.trim(), webhookUrl: $('#sHook').value.trim() } };
    try { await api('/api/settings', body); $('#sKey').value = ''; alert(t('s_saved')); await load(); } catch (e) { fail(e); }
  };
  $('#sTest').onclick = async () => {
    try { const r = await api('/api/test-alert', { partnerKey: $('#sKey').value }); alert(r.delivered ? t('s_test_ok') : t('s_test_fail')); } catch (e) { fail(e); }
  };
}

load().catch(fail);
// refresh the dashboard, but never while the partner is typing in the settings
setInterval(() => {
  if (!status || !status.setupDone || settingsOpen) return;
  const a = document.activeElement;
  if (a && ['INPUT', 'SELECT', 'TEXTAREA'].includes(a.tagName) && a.id !== 'lang') return;
  load().catch(() => {});
}, 30000);
</script>
</body>
</html>
